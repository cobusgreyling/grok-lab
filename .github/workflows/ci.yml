name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [roast-voice, voice-lab, voice-imagine, grok-threads]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install and build ${{ matrix.app }}
        run: |
          cd apps/${{ matrix.app }}
          npm ci
          npm run build
      - name: Lint ${{ matrix.app }}
        run: |
          cd apps/${{ matrix.app }}
          npm run lint --if-present || true
  root-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts || true
      - run: npm run install:all || echo "Install all script is best-effort for now"
