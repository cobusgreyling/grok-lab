version: 2
updates:
  # Root has a package.json for convenience scripts only (no lockfile/deps).
  # Dependabot updates are handled per-app so each standalone demo stays current.
  - package-ecosystem: "npm"
    directory: "/apps/roast-voice"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/voice-lab"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/voice-imagine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/grok-threads"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
