version: 2
updates:
  # Root has a package.json for convenience scripts only (no lockfile/deps).
  # Dependabot updates are handled per-app so each standalone demo stays current.
  - package-ecosystem: "npm"
    directory: "/apps/roast-voice"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10: eslint-plugin-react / eslint-config-next still target eslint ^9
      # (react/display-name crashes: getFilename is not a function).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: native compiler has no JS API yet; typescript-eslint requires
      # the TS 6 API until >=7.1. Next 16.3 can typecheck via tsc CLI, but
      # eslint-config-next still loads typescript-eslint against `typescript`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/apps/voice-lab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/apps/voice-imagine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/apps/grok-threads"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
